
name: "Bug Report"
description: "Report a reproducible bug in Tether."
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Tether!

        Before submitting, check for existing issues.
        Do not include passwords, private keys, tokens, or other secrets.
        For security vulnerabilities, use private security reporting instead.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of Tether is affected?
      options:
        - Android app
        - Windows service
        - Windows desktop UI
        - Windows Credential Provider
        - Device pairing and trust
        - Communication and file transfer
        - Input and trackpad
        - Installation and updates
        - Other / Unsure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what happened and its impact.
      placeholder: Describe the issue you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide clear steps to reproduce the issue.
      placeholder: |
        1. Open Tether on...
        2. Connect to...
        3. Perform...
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tether version or commit
      description: Provide the version, build, branch, or commit hash if known.
      placeholder: "e.g. commit hash or build identifier"
    validations:
      required: false

  - type: input
    id: android
    attributes:
      label: Android environment
      description: Android version and device model, if applicable.
      placeholder: "e.g. Android version and device model"
    validations:
      required: false

  - type: input
    id: windows
    attributes:
      label: Windows environment
      description: Windows edition and version, if applicable.
      placeholder: "e.g. Windows 11 version"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Include relevant error messages, logs, or screenshots.
        Remove sensitive information before posting.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might help investigate this issue.
    validations:
      required: false
