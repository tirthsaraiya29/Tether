name: "Semgrep SAST Scan"

on:
  push:
    branches:
      - main
      - canary
  pull_request:
    branches:
      - main
      - canary
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: "Scan Codebase"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep
        id: scan
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            --error \
            .

      - name: Display Findings in Console
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          python3 -c "
          import json
          with open('semgrep.sarif') as f:
              data = json.load(f)
          results = [r for run in data.get('runs', []) for r in run.get('results', [])]
          if not results:
              print('No findings found.')
          for r in results:
              loc = r.get('locations', [{}])[0].get('physicalLocation', {})
              uri = loc.get('artifactLocation', {}).get('uri', 'unknown')
              line = loc.get('region', {}).get('startLine', 1)
              rule = r.get('ruleId', 'unknown-rule')
              msg = r.get('message', {}).get('text', '').replace('\n', ' ')
              print(f'::error file={uri},line={line},title={rule}::{msg}')
          "

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail if Semgrep failed
        if: always() && steps.scan.outcome == 'failure'
        run: exit 1
