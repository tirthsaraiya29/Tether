name: "Semgrep SAST Scan"

on:
  push:
    branches:
      - main
      - canary
      - beta
  pull_request:
    branches:
      - main
      - canary
      - beta
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: "Scan Codebase"
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Detect changed file types
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            cpp:
              - '**/*.{c,cc,cpp,cxx,h,hh,hpp,hxx}'
            csharp:
              - '**/*.{cs,csx}'
            kotlin:
              - 'apps/android-companion/**'
              - '**/*.{kt,kts,java}'

      - name: Build Semgrep Scope Flags
        id: flags
        shell: bash
        run: |
          # Full scan on schedule or workflow_dispatch
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CPP="${{ steps.filter.outputs.cpp }}"
          CSHARP="${{ steps.filter.outputs.csharp }}"
          KOTLIN="${{ steps.filter.outputs.kotlin }}"

          if [ "$CPP" != "true" ] && [ "$CSHARP" != "true" ] && [ "$KOTLIN" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          
          ARGS=""
          [ "$CPP" = "true" ] && ARGS="$ARGS --include='*.c' --include='*.cc' --include='*.cpp' --include='*.cxx' --include='*.h' --include='*.hpp'"
          [ "$CSHARP" = "true" ] && ARGS="$ARGS --include='*.cs' --include='*.csx'"
          [ "$KOTLIN" = "true" ] && ARGS="$ARGS --include='*.kt' --include='*.kts' --include='*.java'"

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep
        if: steps.flags.outputs.skip == 'false'
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_ARGS: ${{ steps.flags.outputs.args }}

      - name: Upload SARIF to GitHub Security
        if: steps.flags.outputs.skip == 'false' && always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3.28.10
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true