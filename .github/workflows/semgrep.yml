name: "Semgrep SAST Scan"

on:
  push:
    branches:
      - main
      - canary
  pull_request:
    branches:
      - main
      - canary
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: "Scan Codebase"
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          generateSarif: true
          config: |
            p/security-audit
            p/owasp-top-ten

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
