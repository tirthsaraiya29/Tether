
name: Security Report Email Notifications

on:
  push:
    paths:
      - "runs/*.md"
      - "runs/**/*.md"

  workflow_dispatch:
    inputs:
      mode:
        description: "Choose operation"
        required: true
        type: choice
        options:
          - summarize_latest
          - preflight
        default: summarize_latest

      report_path:
        description: "Optional report path, e.g. runs/security_audit_20261031_4.md"
        required: false
        type: string

      resend:
        description: "Resend even if this report was already emailed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: security-report-email-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout reports repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notification workflow
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'summarize_latest' }}
          REPORT_PATH: ${{ inputs.report_path }}
          RESEND: ${{ inputs.resend }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}

          OLLAMA_SUMMARY_API_KEY: ${{ secrets.OLLAMA_SUMMARY_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}

          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

        run: python .github/scripts/report_email_notifications.py

      - name: Commit notification marker
        if: success() && hashFiles('.notifications/*.sent') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .notifications/

          if ! git diff --cached --quiet; then
            git commit -m "Record emailed security report"
            git push
          fi
