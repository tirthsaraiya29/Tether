name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - canary
      - beta
  pull_request:
    branches:
      - main
      - canary
      - beta
  schedule:
    - cron: "21 20 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    name: "Detect Changed Languages"
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Check changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '**/CMakeLists.txt'
              - '**/*.vcxproj'
              - '**/*.vcxproj.filters'
            csharp:
              - '**/*.cs'
              - '**/*.csx'
              - '**/*.csproj'
              - '**/*.sln'
            kotlin:
              - 'apps/android-companion/**'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - '**/*.gradle*'

      - name: Build CodeQL Matrix
        id: set-matrix
        shell: bash
        run: |
          # Full scan on scheduled runs or manual dispatches
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CPP=true
            CSHARP=true
            KOTLIN=true
          else
            CPP="${{ steps.filter.outputs.cpp }}"
            CSHARP="${{ steps.filter.outputs.csharp }}"
            KOTLIN="${{ steps.filter.outputs.kotlin }}"
          fi

          ENTRIES=()
          [ "$CPP" = "true" ] && ENTRIES+=('{"language":"c-cpp","build-mode":"none"}')
          [ "$CSHARP" = "true" ] && ENTRIES+=('{"language":"csharp","build-mode":"none"}')
          [ "$KOTLIN" = "true" ] && ENTRIES+=('{"language":"java-kotlin","build-mode":"manual"}')

          if [ ${#ENTRIES[@]} -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${ENTRIES[*]}")
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$JOINED]}" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: "Analyze (${{ matrix.language }})"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v4.2.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3.28.10
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          dependency-caching: true

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          cd apps/android-companion
          chmod +x gradlew
          ./gradlew --no-daemon clean compileDebugSources

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3.28.10
        with:
          category: "/language:${{ matrix.language }}"